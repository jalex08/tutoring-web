<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · Hero with class switcher · Jose Diaz Tutoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C4C9E;--ink-dark:#143A7A;--hl:#F6E15A;--pad:#E9F2E4;--grid:#C7DDBE;--graphite:#232A2A;--muted:#55605E;--paper:#FBFCFA;--rule:#D5DED2;--margin:#E7A3A3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--graphite);font:400 1.0625rem/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
a{color:var(--ink)}
.mock-bar{background:var(--graphite);color:#fff;font-size:.85rem;padding:7px 16px;text-align:center}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.015em;margin:0}

/* header */
.site-head{position:sticky;top:0;z-index:10;background:rgba(251,252,250,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px}
.brand{text-decoration:none;color:var(--graphite);line-height:1.2}
.brand b{font:800 1.2rem "Bricolage Grotesque",sans-serif;display:block}
.brand small{font-size:.8rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:22px}
.nav a,.brand small{white-space:nowrap}
.nav a.l{color:var(--graphite);text-decoration:none;font-size:.95rem}
.toggle{display:inline-flex;border:1.5px solid var(--graphite);border-radius:7px;overflow:hidden}
.toggle button{font:700 .8rem "Atkinson Hyperlegible",sans-serif;border:0;background:#fff;color:var(--graphite);padding:6px 11px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--graphite);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 1rem "Atkinson Hyperlegible",sans-serif;border-radius:8px;padding:13px 22px;text-decoration:none;min-height:48px}
.btn-primary{background:var(--ink);color:#fff;border:2px solid var(--ink)}
.btn-primary:hover{background:var(--ink-dark)}
.btn-ghost{border:2px solid var(--ink);color:var(--ink);background:transparent}
.head-in .btn{padding:9px 16px;min-height:0}
@media (max-width:1100px){.nav a.l{display:none}}
@media (max-width:560px){.head-in .btn{display:none}.brand small{display:none}}

/* hero */
.hero{padding:56px 0 72px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(2.2rem,4.4vw,3.25rem);line-height:1.08}
.lede{font-size:1.2rem;color:var(--muted);margin:22px 0 26px;max-width:34em}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:10px 26px;padding:0;margin:26px 0 0;font-size:.98rem}
.facts li{display:flex;align-items:center;gap:8px}
.facts span{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;flex:none}
.facts .soft{color:var(--muted);font-weight:400}

/* NEW: class switcher */
.picker-label{font-size:.9rem;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font:700 .92rem "Atkinson Hyperlegible",sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer}
.chip[aria-selected="true"]{background:var(--ink);color:#fff}
.chip:focus-visible,.toggle button:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sheet{margin:0;position:relative;transform:rotate(1.2deg);border-radius:4px;padding:18px 18px 12px;
  background-color:var(--pad);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;box-shadow:0 1px 0 #B9CFB1,0 18px 40px -22px rgba(30,60,30,.45);touch-action:pan-y}
.sheet::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.sheet svg{display:block;width:100%;height:auto;position:relative}
.hand-g{font-family:"Kalam",cursive;fill:var(--graphite)}
.hand{font-family:"Kalam",cursive;fill:var(--ink)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.lbl{font-family:"Atkinson Hyperlegible",sans-serif;font-size:13px;fill:var(--graphite)}
.axis{stroke:var(--graphite);stroke-width:1.6}
.dash{stroke:var(--graphite);stroke-width:1.2;stroke-dasharray:4 4}
.traj{fill:none;stroke:var(--ink);stroke-width:3}
.answer-hi{fill:var(--hl)}
.course{font-size:.9rem;color:var(--muted);margin:16px 0 0}
@media (prefers-reduced-motion:no-preference){
  .traj.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.5s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:900px){
  .hero{padding:36px 0 56px}
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .sheet{transform:rotate(.8deg)}
}

/* motto band */
.motto{background-color:var(--ink);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;color:#fff;text-align:center;padding:72px 24px 64px}
.motto .l1{font:800 clamp(2.2rem,6vw,4rem)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.motto .l2{font:700 clamp(2.2rem,6vw,4rem)/1.2 "Kalam",cursive;color:var(--hl);display:inline-block;border-bottom:4px solid var(--hl);padding:0 6px;margin-top:6px;transform:rotate(-1.5deg)}
.motto .sig{font:400 1.3rem "Kalam",cursive;margin-top:22px;opacity:.9}

/* subjects (unchanged, abbreviated) */
.section{padding:72px 0}
.section h2{font-size:clamp(1.8rem,3.4vw,2.5rem)}
.section .intro{color:var(--muted);max-width:42em;margin:12px 0 32px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--graphite);border-radius:6px;background:#fff}
.levels>div{padding:26px 28px}
.levels>div+div{border-left:1.5px solid var(--graphite)}
.levels h3{font-size:1.3rem}
.levels p{color:var(--muted);font-size:.95rem;margin:4px 0 12px}
.levels ul{list-style:none;padding:0;margin:0}
.levels li{border-top:1px solid var(--rule);padding:9px 0;font-weight:700;font-size:.97rem;display:flex;justify-content:space-between;gap:10px}
.levels li small{font-weight:400;color:var(--muted)}
@media (max-width:900px){.levels{grid-template-columns:1fr}.levels>div+div{border-left:0;border-top:1.5px solid var(--graphite)}}
.rest{text-align:center;color:var(--muted);font-size:.9rem;padding:8px 0 64px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<div class="mock-bar" data-t="bar"></div>

<header class="site-head">

    </nav>

<main id="main">
<div class="hero" id="top">

        <figcaption id="sheet-cap" class="sr-only"></figcaption>
      </figure>
      <p class="course" id="course"></p>
    </div>
  </div>
</div>

<div class="motto">
  <div class="l1" data-t="m1"></div>
  <div class="l2" data-t="m2"></div>
  <div class="sig">Jose</div>

<section class="section" id="subjects">

    <h2 data-t="s-h"></h2>
    <p class="intro" data-t="s-p"></p>
    <div class="levels" id="levels"></div>
  </div>
</section>
<p class="rest" data-t="rest"></p>
</main>

/* RC steps need nested sub+sup; patch in after building */
function rcFix(svg){
  const lines=svg.querySelectorAll('text');
  lines.forEach(t=>{
    if(t.textContent.startsWith("vC(t) = 12 (1 − e")) t.innerHTML='v<tspan font-size="12" dy="4">C</tspan><tspan dy="-4">(t) = 12 (1 − e</tspan><tspan font-size="12" dy="-8">−t/τ</tspan><tspan dy="8">)</tspan>';
    if(t.textContent.startsWith("vC(1) = 12 (1 − e")) t.innerHTML='v<tspan font-size="12" dy="4">C</tspan><tspan dy="-4">(1) = 12 (1 − e</tspan><tspan font-size="12" dy="-8">−1</tspan><tspan dy="8">) = 12 (0.632)</tspan>';
  });
}

let lang="en",cur=0;
const chips=document.getElementById("chips"),svg=document.getElementById("sheet-svg");
function drawSheet(animate){
  svg.innerHTML=P[cur].svg(lang);
  if(P[cur].id==="circuits") rcFix(svg);
  if(!animate) svg.querySelectorAll(".draw").forEach(e=>e.classList.remove("draw"));
  // size the highlighter box to its answer
  svg.querySelectorAll("rect[data-fit]").forEach(r=>{const t=r.nextElementSibling;try{r.setAttribute("width",Math.ceil(t.getBBox().width)+14)}catch(e){}});
  document.getElementById("sheet-cap").textContent=P[cur].cap[lang];
  document.getElementById("course").textContent=P[cur].course[lang];
}
function render(first){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=UI[lang][e.dataset.t]);
  document.querySelectorAll(".toggle button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  chips.innerHTML=P.map((p,i)=>`<button class="chip" role="tab" aria-selected="${i===cur}" tabindex="${i===cur?0:-1}" aria-controls="sheet">${p.chip[lang]}</button>`).join("");
  [...chips.children].forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{
    const k={ArrowRight:(cur+1)%P.length,ArrowLeft:(cur-1+P.length)%P.length,Home:0,End:P.length-1}[e.key];
    if(k!==undefined){e.preventDefault();select(k);chips.children[k].focus()}}});
  document.getElementById("levels").innerHTML=LEVELS[lang].map(([h,p,items])=>`<div><h3>${h}</h3><p>${p}</p><ul>${items.map(([a,b])=>`<li>${a}${b?`<small>${b}</small>`:""}</li>`).join("")}</ul></div>`).join("");
  drawSheet(first);
}
function select(i){
  cur=i;
  [...chips.children].forEach((b,j)=>{b.setAttribute("aria-selected",j===i);b.tabIndex=j===i?0:-1});
  drawSheet(false);
  const u=new URL(location);u.searchParams.set("topic",P[i].id);history.replaceState(null,"",u);
}
document.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render(false)});
let x0=null,y0=null;const sh=document.getElementById("sheet");
sh.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
sh.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>50&&Math.abs(dx)>1.5*Math.abs(dy)) select(dx<0?(cur+1)%P.length:(cur-1+P.length)%P.length);x0=null},{passive:true});
const q=new URLSearchParams(location.search);const k=P.findIndex(p=>p.id===q.get("topic"));if(k>=0)cur=k;if(q.get("lang")==="es")lang="es";
render(true);
function refit(){svg.querySelectorAll("rect[data-fit]").forEach(r=>{const t=r.nextElementSibling;try{r.setAttribute("width",Math.ceil(t.getBBox().width)+14)}catch(e){}})}
if(document.fonts) document.fonts.ready.then(refit);
</script>
