# App Engine standard. Pages are static files; the only code is server.js, which
# handles POST /api/contact (the booking form), the few redirects that static
# handlers can't do, and a real 404 page for every other URL.
# App Engine installs package.json dependencies and runs `npm start`.
runtime: nodejs22

instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 1

default_expiration: "10m"

# Outgoing mail server for the booking form (credentials are in Secret Manager,
# see README "Booking form (email)"). Gmail by default; for another provider
# change these and the smtp-* secrets, e.g. smtp.office365.com / 587.
env_variables:
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  # SMTP_SECURE: "false"     # optional; default true on 465, false (STARTTLS) otherwise
  MAIL_DAILY_LIMIT: "40"     # form submissions per day in total (2 emails each)

handlers:
# English homepage. Short cache so edits show up fast.
- url: /
  static_files: www/index.html
  upload: www/index\.html
  secure: always
  redirect_http_response_code: 301
  expiration: "10m"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Spanish homepage (generated by `npm run build`).
- url: /es/
  static_files: www/es/index.html
  upload: www/es/index\.html
  secure: always
  redirect_http_response_code: 301
  expiration: "10m"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Link-preview image. Long cache.
- url: /og-image\.png
  static_files: www/og-image.png
  upload: www/og-image\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Favicons.
- url: /favicon\.ico
  static_files: www/favicon.ico
  upload: www/favicon\.ico
  mime_type: "image/x-icon"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /favicon\.svg
  static_files: www/favicon.svg
  upload: www/favicon\.svg
  mime_type: "image/svg+xml"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /apple-touch-icon\.png
  static_files: www/apple-touch-icon.png
  upload: www/apple-touch-icon\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Crawler files.
- url: /robots\.txt
  static_files: www/robots.txt
  upload: www/robots\.txt
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /sitemap\.xml
  static_files: www/sitemap.xml
  upload: www/sitemap\.xml
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /llms\.txt
  static_files: www/llms.txt
  upload: www/llms\.txt
  mime_type: "text/plain; charset=utf-8"
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Everything else goes to server.js:
#   /api/contact            booking form (POST only)
#   /index.html -> /,  /es and /es/index.html -> /es/   (301)
#   (/?lang=es is served by the static "/" handler above, which can't see the
#   query string; a script at the top of index.html sends it on to /es/.)
#   any other URL           -> 404 with www/404.html (/api/* -> JSON 404)
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
