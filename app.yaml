# App Engine standard. Images, favicons and crawler files are static files. Every HTML page is
# served by server.js (so it can re-send the visitor's lang cookie, see below): the home
# pages (/ and /es/) and /llms.txt with the prices from the `site-pricing` secret
# filled in, and the exam calendar pages with the dates from the `site-exams` secret
# (HTML private, max-age=600; llms.txt and data.json public), handles POST /api/contact (the
# booking form), the few redirects that static handlers can't do, and a real 404
# page for every other URL.
# App Engine installs package.json dependencies and runs `npm start`.
runtime: nodejs22

instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 1

default_expiration: "10m"

# Resources (free interactive tools, see resources.js and docs/resources-setup.md): the private bucket
# for the tool files and preview cards, and the Firestore database ("(default)", or the named database
# created for them if the project already has a Datastore-mode database).
env_variables:
  RESOURCES_BUCKET: "josediaz-tutoring-res"
  FIRESTORE_DATABASE: "(default)"

handlers:
# Link-preview image. Long cache.
- url: /og-image\.png
  static_files: www/og-image.png
  upload: www/og-image\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Favicons.
- url: /favicon\.ico
  static_files: www/favicon.ico
  upload: www/favicon\.ico
  mime_type: "image/x-icon"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /favicon\.svg
  static_files: www/favicon.svg
  upload: www/favicon\.svg
  mime_type: "image/svg+xml"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /apple-touch-icon\.png
  static_files: www/apple-touch-icon.png
  upload: www/apple-touch-icon\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Crawler files. (/sitemap.xml is served by server.js: the built file + the published resources.)
- url: /robots\.txt
  static_files: www/robots.txt
  upload: www/robots\.txt
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# IndexNow key file (public by design; scripts/indexnow.js checks it before each ping).
# Body is exactly the key, no newline. Not in the sitemap or llms.txt.
- url: /0d95e31492514b3c9a3e7edb5eb12be5\.txt
  static_files: www/0d95e31492514b3c9a3e7edb5eb12be5.txt
  upload: www/0d95e31492514b3c9a3e7edb5eb12be5\.txt
  mime_type: "text/plain; charset=utf-8"
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    X-Robots-Tag: "noindex"

# Everything else goes to server.js:
#   / , /es/ , /llms.txt    built files with the live prices filled in (pricing.js)
#   /exams/ , /exams/algebra-1-eoc/ , /es/examenes/ , /es/examenes/eoc-algebra-1/
#                           built templates (www/exams.html, ...) with the live exam data
#                           and today's dates filled in (exam-calendar.js), 10-minute cache
#   /exams/data.json        the live exam data (JSON, 10-minute cache, X-Robots-Tag: noindex)
#   /exams, /exams.html, /exams/index.html -> /exams/ (and the same for the other three)   (301)
#   any other URL under /exams/ or /es/examenes/ -> the 404 page
#   /api/contact            booking form (POST only)
#   /resources/, /es/recursos/ and /resources/<slug>/, /es/recursos/<slug>/
#                           free interactive tools (resources.js; data from Firestore + Cloud Storage,
#                           published from the admin service). /resources -> /resources/ (301);
#                           /resources/ with lang=es -> /es/recursos/ (302); old slugs 301; unpublished 410
#   /frame/<id>/v<N>        the uploaded tool, with CSP sandbox + frame-ancestors 'self', noindex
#   /resources/og/*.png     preview cards (1 year, immutable)
#   /sitemap.xml            www/sitemap.xml + the library and each published resource
#   /privacy/, /terms/, /accessibility/, /es/privacidad/, /es/terminos/, /es/accesibilidad/
#                           built legal pages (www/privacy.html, ...), Cache-Control: private, max-age=600
#   every HTML page:        a request with a valid lang cookie (en|es) gets it back as a
#                           server-set cookie (Safari keeps those; it drops JS-set ones after 7 days);
#                           HTML is Cache-Control: private, never public
#   www.josediaztutoring.com/<path> -> https://josediaztutoring.com/<normalized path> (301, query kept;
#                           not /api/*; the static files above are not covered)
#   /index.html -> /,  /es and /es/index.html -> /es/   (301)
#   /privacy, /privacy.html -> /privacy/ (and the other legal pages)   (301)
#   /?lang=es -> /es/ (keeps ?topic=)   (301)
#   / and /exams/ with the cookie lang=es (set by the EN/ES toggle) -> /es/ and /es/examenes/
#                           (302, keeps the query string; both pages: Cache-Control private, Vary: Cookie)
#   any other URL           -> 404 with www/404.html (/api/* -> JSON 404)
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
