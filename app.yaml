# App Engine standard. Most pages are static files. server.js serves the home
# pages (/ and /es/) and /llms.txt with the prices from the `site-pricing` secret
# filled in (Cache-Control: public, max-age=600), handles POST /api/contact (the
# booking form), the few redirects that static handlers can't do, and a real 404
# page for every other URL.
# App Engine installs package.json dependencies and runs `npm start`.
runtime: nodejs22

instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 1

default_expiration: "10m"

handlers:
# Legal pages (generated by `npm run build`). Without the trailing slash
# (/privacy, /es/privacidad, ...) or as /privacy.html they reach server.js, which
# 301s to the slash URL. Files: www/privacy.html, www/es/privacidad.html, ...
- url: /(privacy|terms|accessibility)/
  static_files: www/\1.html
  upload: www/(privacy|terms|accessibility)\.html
  secure: always
  redirect_http_response_code: 301
  expiration: "10m"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /es/(privacidad|terminos|accesibilidad)/
  static_files: www/es/\1.html
  upload: www/es/(privacidad|terminos|accesibilidad)\.html
  secure: always
  redirect_http_response_code: 301
  expiration: "10m"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Link-preview image. Long cache.
- url: /og-image\.png
  static_files: www/og-image.png
  upload: www/og-image\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Favicons.
- url: /favicon\.ico
  static_files: www/favicon.ico
  upload: www/favicon\.ico
  mime_type: "image/x-icon"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /favicon\.svg
  static_files: www/favicon.svg
  upload: www/favicon\.svg
  mime_type: "image/svg+xml"
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /apple-touch-icon\.png
  static_files: www/apple-touch-icon.png
  upload: www/apple-touch-icon\.png
  secure: always
  redirect_http_response_code: 301
  expiration: "7d"
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# Crawler files.
- url: /robots\.txt
  static_files: www/robots.txt
  upload: www/robots\.txt
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

- url: /sitemap\.xml
  static_files: www/sitemap.xml
  upload: www/sitemap\.xml
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"

# IndexNow key file (public by design; scripts/indexnow.js checks it before each ping).
# Body is exactly the key, no newline. Not in the sitemap or llms.txt.
- url: /0d95e31492514b3c9a3e7edb5eb12be5\.txt
  static_files: www/0d95e31492514b3c9a3e7edb5eb12be5.txt
  upload: www/0d95e31492514b3c9a3e7edb5eb12be5\.txt
  mime_type: "text/plain; charset=utf-8"
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    X-Robots-Tag: "noindex"

# Everything else goes to server.js:
#   / , /es/ , /llms.txt    built files with the live prices filled in (pricing.js)
#   /api/contact            booking form (POST only)
#   /index.html -> /,  /es and /es/index.html -> /es/   (301)
#   /privacy, /privacy.html -> /privacy/ (and the other legal pages)   (301)
#   /?lang=es -> /es/ (keeps ?topic=)   (301)
#   any other URL           -> 404 with www/404.html (/api/* -> JSON 404)
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
