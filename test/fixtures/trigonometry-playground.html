<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigonometry playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Kalam:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{--ink:#1C4C9E;--ink-d:#143A7A;--hl:#F6E15A;--pad:#E9F2E4;--grid:#C7DDBE;--g:#232A2A;--muted:#55605E;--paper:#FBFCFA;--soft:#D3DCD8;--rule:#D5DED2;--orange:#B8692E;--grey:#6F7B78}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--g);background:var(--paper);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.015em;margin:0;line-height:1.15}
.app{max-width:1140px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap}
h1{font-size:clamp(1.35rem,3.4vw,1.95rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.sub{margin:.25rem 0 0;color:var(--muted)}
.btn{font:700 1rem/1.2 "Atkinson Hyperlegible",system-ui,sans-serif;min-height:44px;padding:10px 18px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;touch-action:manipulation}
.btn:hover{background:var(--ink-d);border-color:var(--ink-d)}
.btn.sec{background:#fff;color:var(--ink)}
.btn.sec:hover{background:var(--pad);color:var(--ink-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;min-width:44px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
.tab{font:700 .98rem "Atkinson Hyperlegible",system-ui,sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:hover{border-color:var(--ink-d)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:880px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0}
.sheet{background:#fff;border:1px solid var(--soft);border-radius:6px;box-shadow:0 1px 2px rgba(35,42,42,.04),0 6px 18px rgba(35,42,42,.06);padding:14px;min-width:0}
.pad{background-color:var(--pad);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
figure{margin:0}
.diag svg{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.diag svg:active{cursor:grabbing}
#uc{max-height:min(72vh,560px);margin:0 auto}
.legend{font-size:.9rem;color:var(--muted);margin-top:8px;background:rgba(255,255,255,.85);padding:6px 8px;border-radius:4px}
.legend b{color:var(--g)}
.sw{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:4px}
label,.lbl{font-weight:700;display:block;margin-bottom:4px}
.help{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.err{color:#8A2B12;font-size:.9rem;margin:4px 0 0;min-height:0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.row>*{min-width:0}
.field{flex:1 1 150px}
input[type=text],select{font:400 1.1rem "Atkinson Hyperlegible",system-ui,sans-serif;min-height:44px;padding:8px 10px;border:1.5px solid #8C9895;border-radius:6px;background:#fff;color:var(--g);width:100%}
input[type=text][aria-invalid="true"]{border-color:#8A2B12}
input[type=range]{width:100%;height:44px;accent-color:var(--ink);margin:0;cursor:pointer}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;min-height:44px;min-width:44px;padding:8px 14px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:#fff;cursor:pointer;font-weight:700}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--ink);outline-offset:-5px;box-shadow:inset 0 0 0 5px #fff}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer;margin:0}
.check input{width:22px;height:22px;accent-color:var(--ink);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip small{font-weight:400;font-size:.78rem;opacity:.9}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:.98rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.math{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.math .ml{margin:6px 0;font-size:1.06rem;min-height:1.6em}
.math .katex{font-size:1.08em}
.hl{background:var(--hl);border-radius:3px;padding:3px 7px;-webkit-box-decoration-break:clone;box-decoration-break:clone;display:inline-block}
.muted{color:var(--muted)}
.signline{margin:10px 0 0;font-size:.97rem}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--soft);border-left:4px solid var(--ink);border-radius:6px;background:#fff;padding:10px 12px;margin-top:10px}
.note svg{flex:0 0 20px;margin-top:2px}
.note strong{display:block}
.note p{margin:2px 0 0}
.note .btn{margin-top:8px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:560px){.levels{grid-template-columns:1fr}}
.lvl{font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;text-align:left;min-height:44px;padding:10px 12px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.lvl small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
.lvl[aria-pressed="true"]{background:var(--ink);color:#fff}
.lvl[aria-pressed="true"] small{color:#E3EAF6}
.score{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 0;font-size:.98rem}
.score b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem}
.code{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.prompt{font-size:1.12rem;margin:0 0 10px}
.prdiag{max-width:360px;margin:6px 0 12px}
.prdiag svg{width:100%;height:auto;display:block}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.key{font:700 1.05rem "Atkinson Hyperlegible",system-ui,sans-serif;min-width:44px;min-height:44px;padding:4px 10px;border-radius:6px;border:1.5px solid #8C9895;background:#fff;color:var(--g);cursor:pointer}
.key:hover{border-color:var(--ink);color:var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.choices .btn{min-width:96px}
.choices .btn.no{background:#fff;color:#8C9895;border-color:#C9D1CE;text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fb{margin-top:10px;min-height:1.5em}
.fb .ok,.fb .bad,.fb .warn{display:flex;gap:8px;align-items:flex-start}
.fb .ok strong{color:var(--ink)}
.fb p{margin:0}
.hintbox{border:1px solid var(--soft);border-left:4px solid var(--ink);border-radius:6px;padding:10px 12px;margin:0 0 10px;background:#fff}
.hintbox .t{font-weight:700;display:block;margin-bottom:2px}
.sol ol{margin:6px 0 0;padding-left:1.4em}
.sol li{margin:6px 0}
.sol li::marker{font-weight:700;color:var(--ink)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
svg text{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;fill:#232A2A}
svg .mth{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.chip,.lvl,.key{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<noscript><p style="padding:16px">This tool needs JavaScript. / Esta herramienta necesita JavaScript.</p></noscript>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <button type="button" class="btn sec" id="reset" data-t="reset"></button>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" class="tab" role="tab" id="tab-circle" data-tab="circle" aria-controls="p-circle" data-t="tabCircle"></button>
    <button type="button" class="tab" role="tab" id="tab-tri" data-tab="tri" aria-controls="p-tri" data-t="tabTri"></button>
    <button type="button" class="tab" role="tab" id="tab-practice" data-tab="practice" aria-controls="p-practice" data-t="tabPractice"></button>
  </div>

  <!-- UNIT CIRCLE -->
  <section role="tabpanel" id="p-circle" aria-labelledby="tab-circle" tabindex="-1">
    <div class="grid2">
      <figure class="sheet pad diag">
        <svg id="uc" viewBox="0 0 400 400" role="img" aria-label=""></svg>
        <figcaption class="legend" id="uc-legend"></figcaption>
      </figure>
      <div class="stack">
        <div class="sheet">
          <div class="row">
            <div class="field">
              <label for="uc-in" data-t="angle"></label>
              <input type="text" id="uc-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="uc-help uc-err">
            </div>
            <div>
              <span class="lbl" id="uc-ul" data-t="units"></span>
              <div class="seg" role="radiogroup" aria-labelledby="uc-ul">
                <input type="radio" name="uc-u" id="uc-deg" value="deg"><label for="uc-deg" data-t="deg"></label>
                <input type="radio" name="uc-u" id="uc-rad" value="rad"><label for="uc-rad" data-t="rad"></label>
              </div>
            </div>
          </div>
          <p class="help" id="uc-help"></p>
          <p class="err" id="uc-err" aria-live="polite"></p>
          <label for="uc-range" style="margin-top:8px" data-t="slider"></label>
          <input type="range" id="uc-range" min="0" max="360" step="1">
          <div class="row" style="align-items:center;margin-top:4px">
            <button type="button" class="btn sec sm" id="uc-prev"><span aria-hidden="true">&#8722;</span><span class="sr" data-t="prevSp"></span></button>
            <button type="button" class="btn sec sm" id="uc-next"><span aria-hidden="true">+</span><span class="sr" data-t="nextSp"></span></button>
            <label class="check"><input type="checkbox" id="uc-snap"><span data-t="snap"></span></label>
          </div>
          <dl class="facts" id="uc-facts"></dl>
        </div>
        <div class="sheet">
          <div class="math" id="uc-math" aria-live="polite"></div>
          <p class="signline" id="uc-sign"></p>
          <div id="uc-notes"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- RIGHT TRIANGLE -->
  <section role="tabpanel" id="p-tri" aria-labelledby="tab-tri" tabindex="-1" hidden>
    <div class="grid2">
      <figure class="sheet diag">
        <svg id="tri" viewBox="0 0 440 300" role="img" aria-label=""></svg>
      </figure>
      <div class="stack">
        <div class="sheet">
          <span class="lbl" id="tri-rl" data-t="ratio"></span>
          <div class="chips" role="radiogroup" aria-labelledby="tri-rl" id="tri-ratio"></div>
          <div class="row" style="margin-top:12px">
            <div>
              <span class="lbl" id="tri-atl" data-t="angleAt"></span>
              <div class="seg" role="radiogroup" aria-labelledby="tri-atl">
                <input type="radio" name="tri-at" id="tri-atA" value="A"><label for="tri-atA">A</label>
                <input type="radio" name="tri-at" id="tri-atB" value="B"><label for="tri-atB">B</label>
              </div>
            </div>
            <div class="field">
              <label for="tri-hide" data-t="findSide"></label>
              <select id="tri-hide"></select>
            </div>
          </div>
          <label for="tri-x" style="margin-top:12px"><span data-t="hLeg"></span>: <output id="tri-xo" for="tri-x"></output></label>
          <input type="range" id="tri-x" min="1" max="12" step="1">
          <label for="tri-y" style="margin-top:6px"><span data-t="vLeg"></span>: <output id="tri-yo" for="tri-y"></output></label>
          <input type="range" id="tri-y" min="1" max="9" step="1">
          <label class="check"><input type="checkbox" id="tri-snap"><span data-t="snapWhole"></span></label>
        </div>
        <div class="sheet">
          <div class="math" id="tri-math" aria-live="polite"></div>
          <dl class="facts" id="tri-facts"></dl>
          <div id="tri-notes"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section role="tabpanel" id="p-practice" aria-labelledby="tab-practice" tabindex="-1" hidden>
    <div class="levels" role="group" aria-label="" id="pr-levels">
      <button type="button" class="lvl" data-lvl="1"></button>
      <button type="button" class="lvl" data-lvl="2"></button>
      <button type="button" class="lvl" data-lvl="3"></button>
    </div>
    <p class="score" id="pr-score" aria-live="polite"></p>
    <div class="grid2" style="margin-top:12px">
      <div class="sheet">
        <p class="code" id="pr-code"></p>
        <div class="prompt" id="pr-prompt"></div>
        <div class="prdiag" id="pr-diag"></div>
        <div id="pr-numwrap">
          <label for="pr-in" data-t="yourAnswer"></label>
          <input type="text" id="pr-in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
          <div class="keys" role="group" id="pr-keys"></div>
        </div>
        <div class="choices" id="pr-choices" role="group"></div>
        <div class="actions">
          <button type="button" class="btn" id="pr-check" data-t="check"></button>
          <button type="button" class="btn sec" id="pr-hint"></button>
          <button type="button" class="btn sec" id="pr-new" data-t="newP"></button>
        </div>
        <div class="fb" id="pr-fb" aria-live="polite"></div>
        <div class="actions" id="pr-after"></div>
      </div>
      <div class="sheet">
        <h2 data-t="helpHints"></h2>
        <div id="pr-help" aria-live="polite"></div>
      </div>
    </div>
  </section>
</div>

<script>
/*CORE-START*/
(function(G){

var BASE={0:{sin:['0',0],cos:['1',1],tan:['0',0]},30:{sin:[H,.5],cos:[S3,r3/2],tan:[T3,r3/3]},45:{sin:[S2,r2/2],cos:[S2,r2/2],tan:['1',1]},60:{sin:[S3,r3/2],cos:[H,.5],tan:['\\sqrt{3}',r3]},90:{sin:['1',1],cos:['0',0],tan:null}};

function fmt(v,dp){if(dp===undefined)dp=4;if(Math.abs(v)<1e-10)v=0;var s=v.toFixed(dp);if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');if(s==='-0')s='0';return s;}

function m(s){return'$'+s+'$';}

/* ---------- answer parsing ---------- */
var UNDEF=/^(undefined|undef|und|dne|does ?not ?exist|indefinid[oa]|no ?est[aá] ?definid[oa]|no ?definid[oa]|no ?existe)$/i;
function parseExpr(str){

  var toks=[],i=0,c,j,t;
  while(i<s.length){c=s.charAt(i);

function triDiagram(sp,L){
  var W=320,Hh=210,s=Math.min(220/sp.adj,140/sp.opp),Ax=46,Ay=182,Cx=Ax+sp.adj*s,By=Ay-sp.opp*s;
  var lab=sp.lab,o='';
  var w=Cx-Ax,h=Ay-By,len=Math.hypot(w,h);
  o+='<polygon points="'+Ax+','+Ay+' '+Cx+','+Ay+' '+Cx+','+By+'" fill="rgba(28,76,158,.07)" stroke="#232A2A" stroke-width="2.5" stroke-linejoin="round"/>';
  o+='<path d="M'+(Cx-12)+','+Ay+'V'+(Ay-12)+'H'+Cx+'" fill="none" stroke="#232A2A" stroke-width="1.5"/>';
  var th=Math.atan2(h,w),r=26;
  o+='<path d="M'+(Ax+r)+','+Ay+'A'+r+','+r+' 0 0 0 '+(Ax+r*Math.cos(th))+','+(Ay-r*Math.sin(th))+'" fill="none" stroke="#1C4C9E" stroke-width="2.5"/>';
  o+='<text x="'+(Ax+r+8)+'" y="'+(Ay-6)+'" font-size="15" fill="#1C4C9E" font-weight="700">'+esc(sp.ang)+'</text>';
  function t(x,y,txt,anc){if(!txt)return'';return'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="16" font-weight="700" text-anchor="'+anc+'"'+(txt==='x'||txt==='?'?' fill="#1C4C9E"':'')+'>'+esc(txt)+'</text>';}
  o+=t((Ax+Cx)/2,Ay+22,lab.adj,'middle');
  o+=t(Cx+8,(Ay+By)/2+5,lab.opp,'start');
  o+=t((Ax+Cx)/2-h/len*16,(Ay+By)/2-w/len*16+4,lab.hyp,'middle');
  var aria=tpl(L.ui.prTriAria,{t:sp.ang,adj:lab.adj||L.ui.blank,opp:lab.opp||L.ui.blank,hyp:lab.hyp||L.ui.blank});
  return'<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(aria)+'">'+o+'</svg>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  // angle arc

  function P(a,r){return(vx+r*Math.cos(a*D2R)).toFixed(1)+','+(vy-r*Math.sin(a*D2R)).toFixed(1);}
  o+='<path d="M'+P(a0,rr)+'A'+rr+','+rr+' 0 0 0 '+P(a1,rr)+'" fill="none" stroke="'+INK+'" stroke-width="2.5"/>';
  var ma=(a0+a1)/2,ml=rr+15;o+=T(vx+ml*Math.cos(ma*D2R)-5,vy-ml*Math.sin(ma*D2R)+6,'\u03b8','font-size="18" font-weight="700" fill="'+INK+'"');
  // labels
  function lab(k,x,y,anc){var r=V.role[k],u=used.indexOf(r)>=0,v=r==='hyp'?V.h:r==='opp'?V.opp:V.adj,txt=L.ab[r]+' = '+(S.hide===r?'?':n2(v));
    return T(x,y,txt,'font-size="15" text-anchor="'+anc+'"'+(u?' font-weight="700" fill="'+INK+'"':' fill="#55605E"'));}
  o+=lab('AC',(Ax+Cx)/2,Ay+22,'middle');
  o+=lab('BC',Cx+10,(Ay+By)/2+5,'start');
  var w=Cx-Ax,h=Ay-By,len=Math.hypot(w,h);
  o+=lab('AB',(Ax+Cx)/2-h/len*14-4,(Ay+By)/2-w/len*14,'end');
  o+=T(Ax-14,Ay+18,'A','font-size="15" font-weight="700" text-anchor="middle"')+T(Cx+10,Ay+18,'C','font-size="15" font-weight="700"')+T(Cx+12,By-6,'B','font-size="15" font-weight="700"');
  o+='<circle cx="'+Cx+'" cy="'+By+'" r="26" fill="transparent"/><circle cx="'+Cx+'" cy="'+By+'" r="10" fill="'+INK+'" stroke="#fff" stroke-width="3"/>';
  if(!touchedTri)o+='<text x="'+(Cx-16)+'" y="'+(By-14)+'" text-anchor="end" font-family="Kalam,cursive" font-size="17" fill="'+INK+'">'+C.esc(U.dragB)+'</text>';
  return o;
}
function triRender(){
  var V=triVals(),svg=$('tri'),fn=S.r,rt=C.RAT[fn];
  svg.innerHTML=triSvg(V);
  svg.setAttribute('aria-label',t('triAria',{x:n2(V.x),y:n2(V.y),h:n2(V.h),at:V.at,t:n2(V.th)}));
  document.querySelectorAll('#tri-ratio .chip').forEach(function(b){var on=b.getAttribute('data-r')===fn;b.setAttribute('aria-checked',on?'true':'false');b.tabIndex=on?0:-1;});
  $('tri-atA').checked=V.at==='A';$('tri-atB').checked=V.at==='B';$('tri-hide').value=S.hide;$('tri-snap').checked=!!S.ts;
  var st=S.ts?'1':'0.1';$('tri-x').step=st;$('tri-y').step=st;$('tri-x').value=String(V.x);$('tri-y').value=String(V.y);
  $('tri-xo').textContent=n2(V.x)+' '+U.unitsW;$('tri-yo').textContent=n2(V.y)+' '+U.unitsW;
  $('tri-x').setAttribute('aria-valuetext',n2(V.x)+' '+U.unitsW);$('tri-y').setAttribute('aria-valuetext',n2(V.y)+' '+U.unitsW);
  var mth=$('tri-math');mth.innerHTML='';
  function line(s,hl){var p=mk('div','ml');var sp=mk('span',hl?'hl':'');tex(sp,s,false);p.appendChild(sp);mth.appendChild(p);}
  var AB=function(k){return'\\text{'+L.ab[k]+'}';},val={opp:V.opp,adj:V.adj,hyp:V.h},ratioTex='\\frac{'+AB(rt[0])+'}{'+AB(rt[1])+'}';
  var hd=S.hide,nt=$('tri-notes');nt.innerHTML='';
  function eqv(v){return Math.abs(v*100-Math.round(v*100))<1e-6?'=':'\\approx ';}
  if(hd==='none'){
    line(AB('hyp')+'=\\sqrt{'+AB('adj')+'^2+'+AB('opp')+'^2}=\\sqrt{'+n2(V.adj)+'^2+'+n2(V.opp)+'^2}'+eqv(V.h)+n2(V.h));
    var rv=val[rt[0]]/val[rt[1]];
    line('\\'+fn+'\\theta='+ratioTex+'=\\frac{'+n2(val[rt[0]])+'}{'+n2(val[rt[1]])+'}'+eqv(rv)+C.fmt(rv,4));
    line('\\theta=\\'+fn+'^{-1}\\left('+C.fmt(rv,4)+'\\right)'+eqv(V.th)+n2(V.th)+'^\\circ',true);
  }else if(rt.indexOf(hd)>=0){
    var other=rt[0]===hd?rt[1]:rt[0],kv=val[other],top=rt[0]===hd?'x':n2(kv),bot=rt[1]===hd?'x':n2(kv),thS=n2(V.th)+'^\\circ',res=val[hd];
    line('\\theta='+thS+',\\quad '+AB(other)+'='+n2(kv));
    line('\\'+fn+'\\theta='+ratioTex+'\\;\\Rightarrow\\;\\'+fn+' '+thS+'=\\frac{'+top+'}{'+bot+'}');
    line(rt[0]===hd?'x='+n2(kv)+'\\,\\'+fn+' '+thS:'x=\\frac{'+n2(kv)+'}{\\'+fn+' '+thS+'}');
    line(AB(hd)+'=x\\approx '+res.toFixed(2),true);
    var py=hd==='hyp'?'\\sqrt{'+n2(V.adj)+'^2+'+n2(V.opp)+'^2}':'\\sqrt{'+n2(V.h)+'^2-'+n2(hd==='opp'?V.adj:V.opp)+'^2}';
    var pp=mk('p','muted');pp.style.margin='8px 0 0';mixed(pp,U.pyCheck+' $'+py+'\\approx '+res.toFixed(2)+'$');mth.appendChild(pp);
  }else{
    line('\\'+fn+'\\theta='+ratioTex);
    var opts=['sin','cos','tan'].filter(function(g){return C.RAT[g].indexOf(hd)>=0;});
    nt.appendChild(note(U.nWrongT,t('nWrongB',{fn:'$\\'+fn+'$',s1:L.sdA[rt[0]],s2:L.sdA[rt[1]],h:L.sdA[hd],opts:opts.map(function(g){return'$\\'+g+'$ ('+C.MN[g]+')';}).join(U.or)})));
  }
  var f=$('tri-facts');f.innerHTML='';
  function fact(k,v){f.appendChild(mk('dt','',k));var dd=mk('dd');mixed(dd,v);f.appendChild(dd);}
  fact(U.thetaW+' ('+V.at+')',n2(V.th)+'\u00b0');fact(U.otherAngle,n2(90-V.th)+'\u00b0');
  if(V.at==='B')nt.appendChild(note(U.nSwapT,U.nSwapB));
}
function setLegs(x,y){var q=S.ts?1:10;S.x=Math.max(1,Math.min(12,Math.round(x*q)/q));S.y=Math.max(1,Math.min(9,Math.round(y*q)/q));saveHash();triRender();}
(function(){var svg=$('tri'),drag=false;
  function mv(e){var p=svgPt(svg,e);setLegs((p.x-TR.Ax)/TR.s,(TR.Ay-p.y)/TR.s);}
  svg.addEventListener('pointerdown',function(e){drag=true;touchedTri=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();mv(e);});
  svg.addEventListener('pointermove',function(e){if(drag)mv(e);});
  function end(){drag=false;}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);})();
$('tri-x').addEventListener('input',function(){touchedTri=true;setLegs(+this.value,S.y);});
$('tri-y').addEventListener('input',function(){touchedTri=true;setLegs(S.x,+this.value);});
$('tri-snap').addEventListener('change',function(){S.ts=this.checked?1:0;if(S.ts){S.x=Math.round(S.x);S.y=Math.round(S.y);}saveHash(true);triRender();});
$('tri-hide').addEventListener('change',function(){S.hide=this.value;saveHash(true);triRender();});
$('tri-atA').addEventListener('change',function(){S.at='A';saveHash(true);triRender();});
$('tri-atB').addEventListener('change',function(){S.at='B';saveHash(true);triRender();});
$('tri-ratio').addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(!b)return;S.r=b.getAttribute('data-r');saveHash(true);triRender();});
$('tri-ratio').addEventListener('keydown',function(e){var L3=['sin','cos','tan'],i=L3.indexOf(S.r),n=i;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(i+1)%3;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(i+2)%3;else return;
  e.preventDefault();S.r=L3[n];saveHash(true);triRender();var b=document.querySelector('#tri-ratio [data-r="'+S.r+'"]');if(b)b.focus();});

/* ================= PRACTICE ================= */
var P={key:null,pr:null,att:0,hints:0,sol:false,solved:false,fb:null,wrong:[],score:{solved:0,streak:0,best:0}};
function ensureSeed(){if(!S.seed){S.seed=1+Math.floor(Math.random()*999999);saveHash(true);}}
function loadProblem(){ensureSeed();var key=S.lvl+':'+S.seed+':'+LANG;if(P.key===key)return;
  P.key=key;P.pr=C.generate(S.lvl,S.seed,LANG);P.att=0;P.hints=0;P.sol=false;P.solved=false;P.fb=null;P.wrong=[];$('pr-in').value='';}
function done(){return P.solved||P.sol;}
function wideLayout(){return window.matchMedia&&window.matchMedia('(min-width:880px)').matches;}
function drawPractice(){
  var pr=P.pr;if(!pr)return;
  document.querySelectorAll('.lvl').forEach(function(b){b.setAttribute('aria-pressed',+b.getAttribute('data-lvl')===S.lvl?'true':'false');});
  var sc=$('pr-score');sc.innerHTML='';[[U.solvedW,P.score.solved],[U.streakW,P.score.streak],[U.bestW,P.score.best]].forEach(function(z){var s=mk('span');s.appendChild(document.createTextNode(z[0]+' '));s.appendChild(mk('b','',String(z[1])));sc.appendChild(s);});
  $('pr-code').textContent=t('code',{s:S.seed});
  mixed($('pr-prompt'),pr.prompt);
  $('pr-diag').innerHTML=pr.svg||'';$('pr-diag').hidden=!pr.svg;
  var isChoice=pr.answer.kind==='choice';
  $('pr-numwrap').hidden=isChoice;$('pr-choices').hidden=!isChoice;$('pr-check').hidden=isChoice;
  if(!isChoice){var inp=$('pr-in');inp.placeholder=U[pr.ph]||'';inp.disabled=done();
    document.querySelectorAll('#pr-keys .key').forEach(function(k){k.disabled=done();k.hidden=(k.getAttribute('data-k')===', '&&pr.answer.kind!=='set')||(k.getAttribute('data-k')==='*'&&pr.type!=='exact');});}
  else{var ch=$('pr-choices');ch.innerHTML='';ch.setAttribute('aria-label',U.yourAnswer);
    pr.answer.options.forEach(function(o){var b=mk('button','btn sec',pr.type==='quad'?t('qN',{q:o.label}):o.label);b.type='button';b.setAttribute('data-id',o.id);
      var wrong=P.wrong.indexOf(o.id)>=0;if(wrong)b.className='btn sec no';
      if(done()&&o.id===pr.answer.correct)b.className='btn';
      b.disabled=done()||wrong;ch.appendChild(b);});}
  $('pr-check').disabled=done();
  var hb=$('pr-hint');hb.hidden=P.sol;hb.textContent=P.hints>=pr.hints.length?U.showSol:U.hint;
  if(P.solved&&!P.sol){hb.hidden=false;hb.textContent=U.seeSteps;}
  $('pr-new').className=done()?'btn':'btn sec';
  // feedback
  var fb=$('pr-fb');fb.innerHTML='';
  if(P.fb){var w=mk('div',P.fb.kind);
    if(P.fb.kind==='ok'){w.innerHTML=CHECK;}
    var body=mk('div');if(P.fb.title)body.appendChild(mk('strong','',P.fb.title+' '));
    if(P.fb.msg){var sp=mk('span');mixed(sp,P.fb.msg);body.appendChild(sp);}
    w.appendChild(body);fb.appendChild(w);}
  // after-actions
  var af=$('pr-after');af.innerHTML='';
  if(done()&&pr.circle){var cb=mk('button','btn sec',U.seeCircle);cb.type='button';cb.addEventListener('click',function(){S.tab='circle';S.a=pr.circle.deg;S.u=pr.circle.unit;radFlag=null;saveHash(true);renderAll();$('tab-circle').focus();});af.appendChild(cb);}
  // help pane
  var hp=$('pr-help');hp.innerHTML='';
  if(!P.hints&&!P.sol){hp.appendChild(mk('p','muted',U.helpEmpty));}
  for(var i=0;i<Math.min(P.hints,pr.hints.length);i++){var hbx=mk('div','hintbox');hbx.appendChild(mk('span','t',t('hintN',{n:i+1})));mixed(hbx.appendChild(mk('div')),pr.hints[i]);hp.appendChild(hbx);}
  if(P.sol){var so=mk('div','sol');so.appendChild(mk('strong','',U.solTitle));var ol=mk('ol');
    pr.steps.forEach(function(s,k){var li=mk('li');if(k===pr.steps.length-1){var hl=mk('span','hl');mixed(hl,s);li.appendChild(hl);}else mixed(li,s);ol.appendChild(li);});
    so.appendChild(ol);hp.appendChild(so);}
}
function exactNote(pr,res){var a=pr.answer;if(!a.exact)return'';if(res&&res.decimal===false)return'';return t('exactForm',{e:'$'+a.exact+'$'});}
function onRight(res){
  var first=!P.sol;P.solved=true;P.score.solved++;P.score.streak++;if(P.score.streak>P.score.best)P.score.best=P.score.streak;
  var pr=P.pr,msg='';
  if(pr.answer.kind==='num'&&!pr.answer.undef){if(pr.answer.exact&&res&&res.decimal)msg=exactNote(pr,res);else if(pr.answer.shown)msg='\u2248 '+pr.answer.shown;}
  if(pr.answer.kind==='set')msg='$x='+pr.answer.exact+'$';
  P.fb={kind:'ok',title:U.correct,msg:msg};void first;
}
function onWrong(diag){
  P.att++;var pr=P.pr,lines=[];
  if(diag)lines.push(diag);
  var two=pr.answer.kind==='choice'&&pr.answer.options.length===2;
  if(two||P.att>=3){P.sol=true;P.score.streak=0;lines.push(U.revealed);}
  else{if(P.hints<P.att)P.hints=P.att;lines.push(wideLayout()?U.hintOpened:U.hintOpenedB);}
  P.fb={kind:'bad',title:U.notQuite,msg:lines.join(' ')};
}
function onCheck(){
  if(done())return;var pr=P.pr,a=pr.answer,v=$('pr-in').value,res;
  res=a.kind==='set'?C.checkSet(v,a):C.checkNum(v,a);
  if(res.status==='empty'){P.fb={kind:'warn',title:'',msg:U.empty};drawPractice();return;}
  if(res.status==='parse'){P.fb={kind:'warn',title:'',msg:U.parseErr};drawPractice();return;}
  if(res.status==='correct')onRight(res);else onWrong(C.diagnose(pr,res,L));
  drawPractice();
}
$('pr-check').addEventListener('click',onCheck);
$('pr-in').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();onCheck();}});
$('pr-choices').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b||done())return;var id=b.getAttribute('data-id');
  if(id===P.pr.answer.correct)onRight(null);else{P.wrong.push(id);onWrong(null);}drawPractice();
  var nb=document.querySelector('#pr-choices button:not([disabled])');if(nb)nb.focus();else $('pr-new').focus();});
$('pr-hint').addEventListener('click',function(){
  var pr=P.pr;if(P.solved&&!P.sol){P.sol=true;drawPractice();return;}
  if(P.hints<pr.hints.length)P.hints++;else{P.sol=true;if(!P.solved)P.score.streak=0;P.fb={kind:'bad',title:'',msg:U.revealed};}
  drawPractice();});
$('pr-new').addEventListener('click',function(){var s;do{s=1+Math.floor(Math.random()*999999);}while(s===S.seed);S.seed=s;saveHash(true);loadProblem();drawPractice();});
$('pr-levels').addEventListener('click',function(e){var b=e.target.closest('[data-lvl]');if(!b)return;var l=+b.getAttribute('data-lvl');if(l===S.lvl)return;S.lvl=l;S.seed=1+Math.floor(Math.random()*999999);saveHash(true);loadProblem();drawPractice();});
$('pr-keys').addEventListener('mousedown',function(e){if(e.target.closest('.key'))e.preventDefault();});
$('pr-keys').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.getAttribute('data-k'),inp=$('pr-in');
  if(k==='*'){inp.value=U.undefKey;inp.focus();return;}
  var s=inp.selectionStart==null?inp.value.length:inp.selectionStart,en=inp.selectionEnd==null?s:inp.selectionEnd;
  inp.value=inp.value.slice(0,s)+k+inp.value.slice(en);var c=s+k.length;inp.focus();try{inp.setSelectionRange(c,c);}catch(_){}});

/* ================= global ================= */
$('reset').addEventListener('click',function(){var tab=S.tab,seed=S.seed,lvl=S.lvl;S=clone(DEF);S.tab=tab;S.seed=seed;S.lvl=lvl;radFlag=null;touchedUC=false;touchedTri=false;saveHash(true);renderAll();});
function renderAll(){showTab();ucRender();triRender();if(S.tab==='practice'||P.pr){loadProblem();drawPractice();}}
S=parseHash();applyText();renderAll();
window.addEventListener('load',function(){if(window.katex)renderAll();});
})();
</script>
