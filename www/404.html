<style>

  *{box-sizing:border-box}

  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
  header{border-bottom:1px solid var(--rule)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .mark{display:inline-block;padding:22px 0;font:800 1.25rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--graphite);text-decoration:none;letter-spacing:-.02em}

  .sheet{max-width:620px;margin:0 24px;padding:36px 36px 32px;border-radius:4px;box-shadow:0 1px 0 #b9cfb1,0 18px 40px -22px rgba(30,60,30,.45);
    background-color:var(--pad);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
  .code{font:700 3.2rem/1 "Kalam",cursive;color:var(--ink);margin:0}
  .code span{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
  h1{font:800 clamp(1.6rem,4vw,2.1rem)/1.12 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em;margin:18px 0 0}
  p{margin:10px 0 0;color:var(--muted)}
  .es{margin-top:26px;padding-top:22px;border-top:1px dashed var(--grid)}
  .es h2{font:800 1.3rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0;color:var(--graphite)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;font:700 1rem/1 "Atkinson Hyperlegible",system-ui,sans-serif;padding:14px 20px;border-radius:8px;text-decoration:none;border:2px solid var(--ink)}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:var(--ink-dark);border-color:var(--ink-dark)}
  .btn-ghost{background:#fff;color:var(--ink)}
